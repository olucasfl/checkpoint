services:
  postgres:
    image: postgres:16-alpine
    container_name: checkpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkpoint}
      POSTGRES_DB: ${POSTGRES_DB:-checkpoint}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - checkpoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-checkpoint} -d ${POSTGRES_DB:-checkpoint}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  checkpoint-postgres-data:
    name: checkpoint-postgres-data
