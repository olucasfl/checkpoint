<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o conteúdo vai até as bordas e a safe-area é respeitada no CSS (env()).
         interactive-widget=resizes-content: com o teclado virtual aberto, o layout encolhe (Chrome
         Android). SEM maximum-scale/user-scalable: travar o zoom fere a WCAG 1.4.4 (spec
         pwa-e-mobile); o zoom ao focar campo no iOS é evitado com fonte >= 16px nos campos. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <!-- PWA (spec pwa-e-mobile, etapa 3). O hex do theme-color repete o token `fundo`; um teste
         confere. O link do manifest é injetado pelo plugin no build. "black" (não
         "black-translucent"): a barra de status do iOS fica preta e o app começa abaixo dela. -->
    <meta name="theme-color" content="#07040f" />
    <meta name="description" content="Seu registro de jogos: zerados, jogando e quero jogar." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="checkpoint" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>checkpoint</title>
    <!-- Fontes e ícones por <link>, sem pacote npm (spec catalogo-jogos, "Fontes e ícones").
         Orbitron: títulos, números e botões. Rajdhani: texto. Material Symbols Rounded: ícones. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Alvo dos elementos position: fixed (barra inferior e avisos), via portal. Fica FORA do #root
         para um transform/filter de um ancestral nunca virar containing block e "prender" o fixed.
         Os <dialog> com showModal() usam o top layer nativo, sem portal. -->
    <div id="overlay-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
